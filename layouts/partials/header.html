<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="{{ site.Params.brandName }} 首页">
      <span class="brand-mark" aria-hidden="true">云</span>
      <span class="brand-text">
        <strong>{{ site.Params.brandName }}</strong>
        <small>{{ site.Params.brandNameEn }}</small>
      </span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} class="is-active" aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
    <a class="header-cta" href="{{ "/contact/" | relURL }}">预约咨询</a>
  </div>
</header>
