{{ define "main" }}
<article>
  <section class="page-head">
    <div class="container">
      <div class="article-meta">
        <span class="tag">{{ .Parent.Title }}</span>
        {{ if not .Date.IsZero }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>{{ end }}
        {{ with .Params.author }}<span>作者：{{ . }}</span>{{ end }}
      </div>
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
    </div>
  </section>

  <section class="page-body">
    <div class="container">
      <div class="prose">{{ .Content }}</div>
      <div class="article-footer">
        <a class="text-link" href="{{ .Parent.RelPermalink }}">← 返回{{ .Parent.Title }}</a>
      </div>
    </div>
  </section>
</article>
{{ end }}
